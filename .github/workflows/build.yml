name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          openjdk-17-jdk \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          python3-pip \
          python3-setuptools \
          python3-dev \
          build-essential \
          wget \
          unzip

    - name: Install Python dependencies
      run: |
        pip install buildozer cython

    - name: Initialize Buildozer
      run: |
        buildozer init

    - name: Edit buildozer.spec
      run: |
        sed -i 's/requirements = python3,kivy/requirements = python3,requests,urllib3/g' buildozer.spec
        sed -i 's/title = My Application/title = System Update/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = systemupdate/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.android/g' buildozer.spec

    - name: Install Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-*.zip
        rm commandlinetools-linux-*.zip
        mv cmdline-tools latest
        echo "export ANDROID_HOME=$HOME/android-sdk" >> $HOME/.bashrc
        echo "export PATH=$PATH:$ANDROID_HOME/latest/bin:$ANDROID_HOME/platform-tools" >> $HOME/.bashrc
        source $HOME/.bashrc

    - name: Accept Android Licenses
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/latest/bin:$ANDROID_HOME/platform-tools
        buildozer android debug deploy run --verbose
