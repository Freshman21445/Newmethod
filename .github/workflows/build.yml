name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git openjdk-17-jdk zlib1g-dev libffi-dev libssl-dev \
            python3-pip build-essential wget unzip \
            autoconf automake libtool pkg-config

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Init Buildozer
        run: buildozer init

      - name: Edit buildozer.spec
        run: |
          sed -i 's/requirements = python3,kivy/requirements = python3,requests,urllib3/g' buildozer.spec
          sed -i 's/title = My Application/title = System Update/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = systemupdate/g' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = com.android/g' buildozer.spec

      - name: Setup Android SDK (Manual)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-*.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
