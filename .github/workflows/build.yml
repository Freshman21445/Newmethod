name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openjdk-17-jdk zlib1g-dev libffi-dev libssl-dev python3-pip build-essential libtool m4 autoconf automake libltdl-dev

      - name: Install Buildozer 1.5.0
        run: |
          pip install buildozer==1.5.0 cython

      - name: Clear stale Buildozer state
        run: |
          rm -rf .buildozer ~/.buildozer || true

      - name: Build APK
        run: |
          yes | buildozer android debug deploy run > build.log 2>&1 || {
            echo "===== BUILD FAILED — LAST 300 LINES ====="
            tail -n 300 build.log
            exit 1
          }
          echo "Build succeeded."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk

      - name: Upload full build log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
