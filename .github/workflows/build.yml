name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK in Docker
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            kivy/buildozer \
            buildozer android debug

      - name: Show output
        run: ls -la bin/ || echo "no bin folder"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
          if-no-files-found: warn
