name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          openjdk-17-jdk \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          python3-pip \
          python3-setuptools \
          python3-dev \
          build-essential

    - name: Install Python dependencies
      run: |
        pip install buildozer cython

    - name: Initialize Buildozer
      run: |
        buildozer init

    - name: Edit buildozer.spec
      run: |
        sed -i 's/requirements = python3,kivy/requirements = python3,requests,urllib3/g' buildozer.spec
        sed -i 's/title = My Application/title = System Update/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = systemupdate/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.android/g' buildozer.spec

    - name: Setup Android SDK and accept licenses
      uses: android-actions/setup-android@v3
      with:
        packages: |
          platform-tools
          build-tools;34.0.0
          platforms;android-34

    - name: Build APK
      run: |
        buildozer android debug deploy run --verbose
