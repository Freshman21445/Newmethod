name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using Docker (non-root, Ubuntu)
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -w /app \
            kivy/buildozer \
            bash -c "
              # Create a non-root user (Ubuntu syntax)
              useradd -m -s /bin/bash builder &&
              chown -R builder:builder /app &&
              su builder -c '
                buildozer init &&
                sed -i \"s/requirements = python3,kivy/requirements = python3,requests,urllib3/g\" buildozer.spec &&
                sed -i \"s/title = My Application/title = System Update/g\" buildozer.spec &&
                sed -i \"s/package.name = myapp/package.name = systemupdate/g\" buildozer.spec &&
                sed -i \"s/package.domain = org.test/package.domain = com.android/g\" buildozer.spec &&
                echo \"android.accept_sdk_license = True\" >> buildozer.spec &&
                buildozer android debug deploy run --verbose
              '
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemupdate-apk
          path: bin/*.apk
